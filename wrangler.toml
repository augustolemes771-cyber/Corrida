name = "corrida"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Arquivos fixos (foto do lobo, ícones)
[assets]
directory = "./public"

# Contas, perfis, pedidos e respostas (o Cloudflare cria sozinho no deploy)
[[d1_databases]]
binding = "DB"
database_name = "corrida"

# Imagens dos perfis e dados temporários (já existia: respostas antigas)
[[kv_namespaces]]
binding = "RESPOSTAS"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

