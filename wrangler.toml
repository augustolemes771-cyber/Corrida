name = "corrida"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Toda segunda, 6h (horário de Brasília): atualiza os postos do mapa
[triggers]
crons = ["0 9 * * 1"]

# Arquivos fixos (foto do lobo, ícones, mapa)
[assets]
directory = "./public"

# Contas, perfis, pedidos e respostas (o Cloudflare cria sozinho no deploy)
[[d1_databases]]
binding = "DB"
database_name = "corrida"

# Imagens dos perfis e dados temporários (já existia: respostas antigas)
[[kv_namespaces]]
binding = "RESPOSTAS"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# ---- Dados do dono (usados só para criar a conta dele na primeira vez) ----
[vars]
